services:
  db:
    image: mysql:8.0
    container_name: hatespeech-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootsecret}
      MYSQL_DATABASE: ${DB_DATABASE:-HateSpeech}
      MYSQL_USER: ${DB_USERNAME:-hatespeech_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-hatespeech_pass}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    command: >
      --default-authentication-plugin=caching_sha2_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --sql-mode=STRICT_TRANS_TABLES,NO_ZERO_IN_DATE,NO_ZERO_DATE,ERROR_FOR_DIVISION_BY_ZERO,NO_ENGINE_SUBSTITUTION
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root --password=\"$${MYSQL_ROOT_PASSWORD}\""]
      start_period: 30s
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - hatespeech-net

  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    container_name: hatespeech-backend
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-development}
      LOGIN_GUI_MODE: ${LOGIN_GUI_MODE:-novnc}
      NOVNC_PORT: ${NOVNC_PORT:-6080}
      NOVNC_PUBLIC_URL: ${NOVNC_PUBLIC_URL:-}
      MODEL_DOWNLOAD_URL: ${MODEL_DOWNLOAD_URL:-https://github.com/cipalipampam/hate-speech-detection/releases/latest/download/best_model.pt}
    ports:
      - "${FASTAPI_PORT:-8080}:8080"
      - "${NOVNC_PORT:-6080}:6080"
    volumes:
      - ./backend:/app
      - ./backend/saved_models:/app/saved_models
      - ./backend/storage/sessions:/app/storage/sessions
      - ./backend/storage/exports:/app/storage/exports
      - pip_cache:/root/.cache/pip
      - huggingface_cache:/root/.cache/huggingface
    healthcheck:
      # Ready only after the model has loaded.
      test: ["CMD-SHELL", "python -c 'import json, urllib.request; response = urllib.request.urlopen(\"http://localhost:8080/\", timeout=5); assert json.load(response)[\"model_status\"] == \"loaded\"'"]
      start_period: 900s
      interval: 30s
      timeout: 10s
      retries: 5
    depends_on:
      db:
        condition: service_healthy
    networks:
      - hatespeech-net

  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
    container_name: hatespeech-frontend
    restart: unless-stopped
    environment:
      APP_NAME: "HateSense ID Lab"
      APP_ENV: ${APP_ENV:-local}
      # Generated and persisted by the entrypoint when absent.
      APP_DEBUG: ${APP_DEBUG:-true}
      APP_URL: "http://localhost:${FRONTEND_PORT:-8000}"
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-HateSpeech}
      DB_USERNAME: ${DB_USERNAME:-hatespeech_user}
      DB_PASSWORD: ${DB_PASSWORD:-hatespeech_pass}
      FASTAPI_BASE_URL: "http://backend:8080/api/v1"
      FASTAPI_TIMEOUT: 120
      SESSION_DRIVER: database
      CACHE_STORE: database
      QUEUE_CONNECTION: database
      LOG_CHANNEL: stack
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_DEPRECATIONS_CHANNEL: "null"
    ports:
      - "${FRONTEND_PORT:-8000}:8000"
    volumes:
      - ./frontend:/var/www/html
      - frontend_vendor:/var/www/html/vendor
      - frontend_node_modules:/var/www/html/node_modules
      - frontend_bootstrap_cache:/var/www/html/bootstrap/cache
      - frontend_storage:/var/www/html/storage
      - composer_cache:/root/.composer/cache
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_healthy
    networks:
      - hatespeech-net

volumes:
  db_data:
    driver: local
  frontend_vendor:
    driver: local
  frontend_node_modules:
    driver: local
  frontend_storage:
    driver: local
  frontend_bootstrap_cache:
    driver: local
  pip_cache:
    driver: local
  composer_cache:
    driver: local
  huggingface_cache:
    driver: local
networks:
  hatespeech-net:
    driver: bridge
    name: hatespeech-net
